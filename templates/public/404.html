<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Code Academy | SEA TECH</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
</head>
<body>

    {% include 'partials/navbar.html' %}

    <main class="error-page">
        <div class="error-container">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>Sorry, the page you are looking for does not exist or may have been moved.</p>
            <div class="error-actions">
                <a href="{{ url_for('public.home') }}" class="btn btn-primary">
                    Go Back Home
                </a>
                <a href="{{ url_for('auth.access_verification') }}" class="btn btn-secondary">
                    Enter Access Code
                </a>
            </div>
        </div>
    </main>

    {% include 'partials/footer.html' %}

    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
</body>
</html>
